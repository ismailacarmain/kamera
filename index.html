<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Proje4 Kesin Çözüm</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; background: #000; }
        
        /* Arayüz */
        .panel { 
            position: absolute; z-index: 10; 
            background: rgba(0, 0, 0, 0.9); 
            padding: 20px; border-radius: 15px; 
            text-align: center; width: 85%; max-width: 350px; 
            border: 1px solid #444;
        }

        h2 { margin-top: 0; color: #fff; }
        p { color: #aaa; font-size: 13px; margin-bottom: 15px; }

        input { 
            padding: 15px; width: 100%; margin-bottom: 10px; 
            border-radius: 8px; border: 1px solid #555; 
            background: #222; color: #fff; text-align: center; 
            font-size: 18px; font-weight: bold; box-sizing: border-box;
        }

        /* Butonlar */
        .btn { 
            width: 100%; padding: 15px; cursor: pointer; border: none; 
            border-radius: 8px; font-weight: bold; font-size: 16px; 
            margin-top: 5px; color: white;
        }
        .btn-host { background: #27ae60; } /* Yeşil */
        .btn-viewer { background: #2980b9; } /* Mavi */
        
        /* Durum Çubuğu */
        .status-bar {
            position: absolute; bottom: 30px; z-index: 20;
            background: rgba(0,0,0,0.7); padding: 10px 20px;
            border-radius: 50px; font-size: 14px; color: #0f0;
            border: 1px solid #0f0;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui" class="panel">
        <h2>Bağlantı Paneli</h2>
        <p>Basit bir oda adı girin (Örn: 123, ev, test)</p>
        
        <input type="text" id="room-name" placeholder="Oda Adı Girin">
        
        <div id="host-controls">
            <p style="color:#f1c40f;">Telefon:</p>
            <button class="btn btn-host" onclick="startAsHost()">YAYINI BAŞLAT (Telefon)</button>
        </div>

        <div id="viewer-controls">
             <p style="color:#3498db;">Bilgisayar:</p>
            <button class="btn btn-viewer" onclick="startAsViewer()">İZLEMEYE BAŞLA (PC)</button>
        </div>
    </div>

    <video id="videoDisplay" autoplay playsinline></video>
    <div id="status" class="status-bar hidden">Durum: Hazır</div>

    <script>
        let peer;
        let localStream;
        // Çok daha kapsamlı STUN listesi (Bağlantı garantisi için)
        const config = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        // --- TELEFON (HOST) KODLARI ---
        function startAsHost() {
            const room = getRoom();
            if(!room) return;

            showStatus("Kamera açılıyor...");
            
            // 1080p yerine 720p kullanarak bağlantı şansını artırıyoruz (Donmayı engeller)
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 1280, height: 720 }, 
                audio: true 
            })
            .then(stream => {
                localStream = stream;
                // Kendi görüntünü ekranda gör (muted)
                const vid = document.getElementById('videoDisplay');
                vid.srcObject = stream;
                vid.muted = true; 

                document.getElementById('ui').classList.add('hidden');
                showStatus("Sunucuya bağlanılıyor...");

                // Peer'i başlat
                peer = new Peer(room + "-host", config);

                peer.on('open', (id) => {
                    showStatus("Yayın başladı! PC aranıyor...");
                    // *** KRİTİK NOKTA: Telefon sürekli PC'yi arar ***
                    connectToViewer(room + "-viewer");
                });

                peer.on('error', err => {
                    console.log(err);
                    // Eğer oda doluysa veya hata varsa PC'yi aramayı tekrar dene
                    if(err.type === 'peer-unavailable') {
                        showStatus("PC henüz gelmedi, bekleniyor...");
                        setTimeout(() => connectToViewer(room + "-viewer"), 2000);
                    }
                });
            })
            .catch(err => alert("Kamera Hatası: " + err));
        }

        // Telefonun PC'yi arama döngüsü
        function connectToViewer(viewerId) {
            // PC'yi görüntülü ara
            const call = peer.call(viewerId, localStream);
            
            if(call) {
                showStatus("PC Bulundu! Görüntü gönderiliyor...");
                call.on('close', () => {
                    showStatus("PC ayrıldı. Tekrar aranıyor...");
                    setTimeout(() => connectToViewer(viewerId), 2000);
                });
            } else {
                // Eğer arama başarısızsa (PC yoksa) 2 saniye sonra tekrar dene
                setTimeout(() => connectToViewer(viewerId), 2000);
            }
        }


        // --- BİLGİSAYAR (VIEWER) KODLARI ---
        function startAsViewer() {
            const room = getRoom();
            if(!room) return;

            document.getElementById('ui').classList.add('hidden');
            showStatus("Bağlantı bekleniyor...");

            // PC sadece bekler, sabit bir ID alır
            peer = new Peer(room + "-viewer", config);

            peer.on('open', (id) => {
                showStatus("Hazır! Telefonda 'Yayını Başlat'a bas.");
            });

            // Telefon bizi aradığında
            peer.on('call', (call) => {
                showStatus("BAĞLANTI GELDİ! Görüntü alınıyor...");
                call.answer(); // Aramayı kabul et

                call.on('stream', (remoteStream) => {
                    const vid = document.getElementById('videoDisplay');
                    vid.srcObject = remoteStream;
                    vid.muted = false; // Sesi aç
                    
                    // Tarayıcıların "Otomatik Oynatma" engeli için Promise
                    const playPromise = vid.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            showStatus("Videoyu başlatmak için ekrana tıkla!");
                            document.body.addEventListener('click', () => vid.play());
                        });
                    }
                });
            });
            
            peer.on('disconnected', () => {
                showStatus("Bağlantı koptu. Tekrar bağlanılıyor...");
                peer.reconnect();
            });
        }

        function getRoom() {
            const r = document.getElementById('room-name').value.trim();
            if(r.length < 2) { alert("Oda adı girin!"); return null; }
            return r.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function showStatus(msg) {
            const el = document.getElementById('status');
            el.classList.remove('hidden');
            el.innerText = msg;
        }
    </script>
</body>
</html>
