<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra Kalite Yayın</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
        }
        
        /* Video Alanı */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* CONTAIN: Ekrana sığdırır, oranı korur */
            background: #000;
        }

        /* Küçük Ön İzleme (Telefon için kendi kamerası) */
        #selfView {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 120px;
            height: 160px;
            border-radius: 12px;
            border: 2px solid #0f0;
            object-fit: cover;
            z-index: 15;
            display: none;
        }
        
        /* Arayüz Paneli */
        .panel { 
            position: absolute; 
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; 
            background: rgba(0, 0, 0, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            width: 90%; 
            max-width: 400px; 
            border: 2px solid #444;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }

        h2 { 
            margin-bottom: 10px; 
            color: #fff; 
            font-size: 24px;
            text-shadow: 0 2px 10px rgba(0,255,0,0.3);
        }
        
        p { 
            color: #aaa; 
            font-size: 14px; 
            margin-bottom: 20px; 
        }

        /* Kalite Seçenekleri */
        .quality-selector {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid #333;
        }

        .quality-selector label {
            display: block;
            margin-bottom: 8px;
            color: #0f0;
            font-weight: bold;
            font-size: 13px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #222;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        select option {
            background: #222;
            color: #fff;
        }

        input { 
            padding: 15px; 
            width: 100%; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            border: 1px solid #555; 
            background: #1a1a1a; 
            color: #fff; 
            text-align: center; 
            font-size: 18px; 
            font-weight: bold;
        }

        input:focus {
            outline: none;
            border-color: #0f0;
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }

        /* Butonlar */
        .btn { 
            width: 100%; 
            padding: 18px; 
            cursor: pointer; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 17px; 
            margin-top: 10px; 
            color: white;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        .btn-host { 
            background: linear-gradient(135deg, #27ae60, #229954);
            box-shadow: 0 5px 20px rgba(39, 174, 96, 0.4);
        }
        
        .btn-viewer { 
            background: linear-gradient(135deg, #2980b9, #1f618d);
            box-shadow: 0 5px 20px rgba(41, 128, 185, 0.4);
        }

        .btn:hover {
            filter: brightness(1.2);
        }

        /* Kontrol Çubuğu (Yayın sırasında) */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: none;
            gap: 10px;
        }

        .control-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-btn.mic {
            background: #e74c3c;
            color: white;
        }

        .control-btn.cam {
            background: #f39c12;
            color: white;
        }

        .control-btn.end {
            background: #c0392b;
            color: white;
        }

        .control-btn:hover {
            transform: scale(1.05);
        }

        /* Durum Çubuğu */
        .status-bar {
            position: absolute; 
            top: 20px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0,0,0,0.85); 
            padding: 12px 30px;
            border-radius: 50px; 
            font-size: 14px; 
            font-weight: bold;
            border: 2px solid #0f0;
            box-shadow: 0 5px 25px rgba(0,255,0,0.3);
            display: none;
        }

        .status-bar.connected {
            border-color: #0f0;
            color: #0f0;
        }

        .status-bar.waiting {
            border-color: #f39c12;
            color: #f39c12;
        }

        .status-bar.error {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        /* Bilgi Metni */
        .info-text {
            color: #3498db;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.6;
        }

        .hidden { display: none !important; }

        /* Responsive */
        @media (max-width: 480px) {
            .panel { padding: 20px; max-width: 90%; }
            h2 { font-size: 20px; }
            .btn { font-size: 15px; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Ana Video (Gelen Yayın veya Kendi Kamera) -->
        <video id="mainVideo" autoplay playsinline></video>
        
        <!-- Küçük Ön İzleme (Kendi Kamera) -->
        <video id="selfView" autoplay playsinline muted></video>
    </div>

    <!-- Başlangıç Paneli -->
    <div id="ui" class="panel">
        <h2>🎥 Ultra Kalite Yayın</h2>
        <p>Çift yönlü iletişim ve 4K kalite desteği</p>
        
        <input type="text" id="room-name" placeholder="Oda Adı (örn: toplanti123)">
        
        <!-- Kalite Ayarları (Sadece Telefon için) -->
        <div id="qualitySettings" class="quality-selector">
            <label>📹 Kamera Kalitesi (Telefon)</label>
            <select id="qualitySelect">
                <option value="4k60">4K 60fps (3840x2160) - Ultra</option>
                <option value="4k30">4K 30fps (3840x2160) - Yüksek</option>
                <option value="1080p60">Full HD 60fps (1920x1080)</option>
                <option value="1080p30" selected>Full HD 30fps (1920x1080) - Önerilen</option>
                <option value="720p60">HD 60fps (1280x720)</option>
                <option value="720p30">HD 30fps (1280x720) - Hızlı</option>
            </select>
        </div>

        <div id="host-controls">
            <p style="color:#27ae60; font-weight: bold;">📱 TELEFON (YAYINCI)</p>
            <button class="btn btn-host" onclick="startAsHost()">🎬 YAYINI BAŞLAT</button>
        </div>

        <div id="viewer-controls">
            <p style="color:#2980b9; font-weight: bold;">💻 BİLGİSAYAR (İZLEYİCİ)</p>
            <button class="btn btn-viewer" onclick="startAsViewer()">👁️ İZLEMEYE BAŞLA</button>
        </div>

        <p class="info-text">💡 Aynı oda adını her iki cihazda da girin. İzleyici de telefona görüntü/ses gönderebilir!</p>
    </div>

    <!-- Durum Çubuğu -->
    <div id="status" class="status-bar waiting">Hazır</div>

    <!-- Kontrol Butonları -->
    <div id="controls" class="controls">
        <button class="control-btn mic" id="micBtn" onclick="toggleMic()">🎤 Mikrofon</button>
        <button class="control-btn cam" id="camBtn" onclick="toggleCam()">📹 Kamera</button>
        <button class="control-btn end" onclick="endCall()">❌ Bitir</button>
    </div>

    <script>
        let peer;
        let localStream;
        let remoteStream;
        let currentCall;
        let isHost = false;
        let isMicOn = true;
        let isCamOn = true;

        // Gelişmiş STUN/TURN sunucuları
        const config = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' },
                    { urls: 'stun:stun.services.mozilla.com' }
                ],
                // Gelişmiş bağlantı ayarları
                iceTransportPolicy: 'all',
                bundlePolicy: 'max-bundle',
                rtcpMuxPolicy: 'require'
            }
        };

        // Kalite ayarlarını getir
        function getQualityConstraints() {
            const quality = document.getElementById('qualitySelect').value;
            const constraints = {
                '4k60': { width: 3840, height: 2160, frameRate: 60 },
                '4k30': { width: 3840, height: 2160, frameRate: 30 },
                '1080p60': { width: 1920, height: 1080, frameRate: 60 },
                '1080p30': { width: 1920, height: 1080, frameRate: 30 },
                '720p60': { width: 1280, height: 720, frameRate: 60 },
                '720p30': { width: 1280, height: 720, frameRate: 30 }
            };
            return constraints[quality];
        }

        // ===== TELEFON (HOST/YAYINCI) =====
        async function startAsHost() {
            const room = getRoom();
            if(!room) return;

            isHost = true;
            showStatus("Kamera açılıyor...", "waiting");

            const videoConstraints = getQualityConstraints();
            
            try {
                // Arka kamera ile yüksek kalite
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: videoConstraints.width },
                        height: { ideal: videoConstraints.height },
                        frameRate: { ideal: videoConstraints.frameRate },
                        aspectRatio: { ideal: 16/9 }
                    }, 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Kendi görüntüsünü küçük pencerede göster
                document.getElementById('selfView').srcObject = localStream;
                document.getElementById('selfView').style.display = 'block';

                hideUI();
                showStatus("Sunucuya bağlanılıyor...", "waiting");

                // Peer başlat
                peer = new Peer(room + "-host", config);

                peer.on('open', (id) => {
                    showStatus("🔴 CANLI - İzleyici bekleniyor...", "waiting");
                    connectToViewer(room + "-viewer");
                });

                // Gelen aramayı kabul et (İzleyici'den gelen görüntü)
                peer.on('call', (call) => {
                    showStatus("🔗 İzleyici bağlandı!", "connected");
                    call.answer(localStream); // Kendi görüntümüzü gönder
                    
                    call.on('stream', (remoteStreamData) => {
                        remoteStream = remoteStreamData;
                        // İzleyicinin görüntüsünü ana ekranda göster
                        document.getElementById('mainVideo').srcObject = remoteStreamData;
                        document.getElementById('mainVideo').muted = false;
                        document.getElementById('mainVideo').play();
                        showStatus("✅ İzleyici ile bağlantı kuruldu!", "connected");
                    });
                });

                peer.on('error', err => {
                    console.log(err);
                    if(err.type === 'peer-unavailable') {
                        setTimeout(() => connectToViewer(room + "-viewer"), 3000);
                    }
                });

            } catch(err) {
                alert("Kamera Hatası: " + err.message);
                showStatus("❌ Hata: " + err.message, "error");
            }
        }

        function connectToViewer(viewerId) {
            const call = peer.call(viewerId, localStream);
            
            if(call) {
                currentCall = call;
                showStatus("📡 İzleyici ile bağlanıyor...", "waiting");
                
                call.on('stream', (remoteStreamData) => {
                    remoteStream = remoteStreamData;
                    document.getElementById('mainVideo').srcObject = remoteStreamData;
                    document.getElementById('mainVideo').muted = false;
                    showStatus("✅ Bağlantı başarılı!", "connected");
                });

                call.on('close', () => {
                    showStatus("📴 Bağlantı koptu. Yeniden deneniyor...", "waiting");
                    setTimeout(() => connectToViewer(viewerId), 3000);
                });
            } else {
                setTimeout(() => connectToViewer(viewerId), 3000);
            }
        }

        // ===== BİLGİSAYAR (VIEWER/İZLEYİCİ) =====
        async function startAsViewer() {
            const room = getRoom();
            if(!room) return;

            isHost = false;
            showStatus("Kamera açılıyor...", "waiting");

            try {
                // İzleyici de kamera ve mikrofon aç (çift yönlü iletişim)
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    }, 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Kendi görüntüsünü küçük pencerede göster
                document.getElementById('selfView').srcObject = localStream;
                document.getElementById('selfView').style.display = 'block';

                hideUI();
                showStatus("Bağlantı kuruluyor...", "waiting");

                peer = new Peer(room + "-viewer", config);

                peer.on('open', (id) => {
                    showStatus("✅ Hazır! Telefonda yayını başlat.", "waiting");
                });

                // Telefon aradığında
                peer.on('call', (call) => {
                    showStatus("📞 Yayıncı aranıyor...", "waiting");
                    call.answer(localStream); // Kendi görüntümüzü gönder

                    call.on('stream', (remoteStreamData) => {
                        currentCall = call;
                        remoteStream = remoteStreamData;
                        
                        // Yayıncının görüntüsünü ana ekranda göster
                        const mainVid = document.getElementById('mainVideo');
                        mainVid.srcObject = remoteStreamData;
                        mainVid.muted = false;
                        
                        const playPromise = mainVid.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => {
                                    showStatus("🎥 CANLI YAYIN İZLENİYOR", "connected");
                                })
                                .catch(error => {
                                    showStatus("▶️ Oynatmak için ekrana tıkla!", "waiting");
                                    document.body.addEventListener('click', () => {
                                        mainVid.play();
                                        showStatus("🎥 CANLI YAYIN İZLENİYOR", "connected");
                                    }, { once: true });
                                });
                        }
                    });
                });

                peer.on('disconnected', () => {
                    showStatus("🔄 Yeniden bağlanılıyor...", "waiting");
                    peer.reconnect();
                });

            } catch(err) {
                alert("Kamera/Mikrofon Hatası: " + err.message);
                showStatus("❌ Hata: " + err.message, "error");
            }
        }

        // ===== KONTROL FONKSİYONLARI =====
        function toggleMic() {
            if(!localStream) return;
            
            const audioTrack = localStream.getAudioTracks()[0];
            if(audioTrack) {
                isMicOn = !isMicOn;
                audioTrack.enabled = isMicOn;
                document.getElementById('micBtn').style.background = isMicOn ? '#27ae60' : '#e74c3c';
                document.getElementById('micBtn').textContent = isMicOn ? '🎤 Mikrofon Açık' : '🔇 Mikrofon Kapalı';
            }
        }

        function toggleCam() {
            if(!localStream) return;
            
            const videoTrack = localStream.getVideoTracks()[0];
            if(videoTrack) {
                isCamOn = !isCamOn;
                videoTrack.enabled = isCamOn;
                document.getElementById('camBtn').style.background = isCamOn ? '#f39c12' : '#e74c3c';
                document.getElementById('camBtn').textContent = isCamOn ? '📹 Kamera Açık' : '📷 Kamera Kapalı';
            }
        }

        function endCall() {
            if(currentCall) currentCall.close();
            if(localStream) localStream.getTracks().forEach(track => track.stop());
            if(peer) peer.destroy();
            location.reload();
        }

        // ===== YARDIMCI FONKSİYONLAR =====
        function getRoom() {
            const r = document.getElementById('room-name').value.trim();
            if(r.length < 2) { 
                alert("⚠️ En az 2 karakter oda adı girin!"); 
                return null; 
            }
            return r.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function showStatus(msg, type = "waiting") {
            const el = document.getElementById('status');
            el.className = 'status-bar ' + type;
            el.style.display = 'block';
            el.innerText = msg;
        }

        function hideUI() {
            document.getElementById('ui').classList.add('hidden');
            document.getElementById('controls').style.display = 'flex';
        }

        // Ekran kapatma engelleyici (Mobil)
        if('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(err => console.log('WakeLock error:', err));
        }
    </script>
</body>
</html>
