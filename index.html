<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Maç Yayını</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-container { position: absolute; z-index: 10; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; text-align: center; width: 80%; max-width: 400px; }
        input { padding: 10px; width: 70%; margin: 5px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; }
        .btn-green { background: #28a745; color: white; }
        .btn-blue { background: #007bff; color: white; }
        .hidden { display: none !important; }
        #my-id { font-size: 24px; color: #ffc107; font-weight: bold; margin: 10px 0; user-select: all; }
        .status { font-size: 12px; color: #ccc; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ui" class="ui-container">
        <h2>Canlı Bağlantı</h2>
        <div id="loader">ID alınıyor...</div>
        <div id="id-display" class="hidden">
            <p>Senin ID'n:</p>
            <div id="my-id">...</div>
            <p style="font-size:12px; color:#aaa;">Bu kodu bilgisayara gir.</p>
        </div>
        
        <hr style="border-color: #444;">

        <div>
            <input type="text" id="remote-id" placeholder="Telefondaki ID'yi gir">
            <br>
            <button class="btn-blue" onclick="connectToStream()">BİLGİSAYARDAN İZLE</button>
        </div>

        <br>
        <button class="btn-green" onclick="startBroadcast()">TELEFONDAN YAYINLA</button>
        
        <div class="status" id="status-msg">Hazır</div>
    </div>

    <video id="remoteVideo" autoplay playsinline muted></video>

    <script>
        const peer = new Peer(); // Sunucu gerekmez, PeerJS bulutunu kullanır
        let localStream;
        let myPeerId;

        // ID Oluşunca
        peer.on('open', (id) => {
            myPeerId = id;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('id-display').classList.remove('hidden');
            document.getElementById('my-id').innerText = id;
            setStatus("Bağlantıya hazır.");
        });

        // --- YAYINCI KISMI (TELEFON) ---
        function startBroadcast() {
            setStatus("Kamera açılıyor...");
            
            // Arka kamerayı açmaya zorla (facingMode: environment)
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: { ideal: "environment" }, 
                    width: { ideal: 1280 }, 
                    height: { ideal: 720 } 
                }, 
                audio: true 
            })
            .then((stream) => {
                localStream = stream;
                // Kendi görüntümüzü ekrana verelim
                const video = document.getElementById('remoteVideo');
                video.srcObject = stream;
                video.muted = true; // Yankı yapmasın
                
                // Arayüzü gizle
                document.getElementById('ui').classList.add('hidden');
                setStatus("Yayın başladı! PC bekleniyor...");
            })
            .catch(err => {
                alert("Kamera hatası: " + err);
                setStatus("Hata: " + err);
            });
        }

        // Biri bize bağlanırsa (PC bağlanınca)
        peer.on('call', (call) => {
            // Gelen aramayı cevapla ve görüntümüzü gönder
            if(localStream) {
                call.answer(localStream);
                setStatus("PC Bağlandı! Yayın gidiyor.");
            }
        });

        // --- İZLEYİCİ KISMI (BİLGİSAYAR) ---
        function connectToStream() {
            const remoteId = document.getElementById('remote-id').value;
            if(!remoteId) return alert("Lütfen ID girin!");

            setStatus("Bağlanılıyor...");

            // Karşı tarafı ara (Görüntü göndermiyoruz, sadece alacağız)
            const call = peer.call(remoteId, new MediaStream()); 

            call.on('stream', (remoteStream) => {
                const video = document.getElementById('remoteVideo');
                video.srcObject = remoteStream;
                video.muted = false; // Sesi aç
                
                // Arayüzü gizle
                document.getElementById('ui').classList.add('hidden');
                setStatus("Yayın alınıyor!");
            });
            
            call.on('error', (err) => {
                alert("Bağlantı hatası: " + err);
            });
        }

        function setStatus(msg) {
            document.getElementById('status-msg').innerText = msg;
            console.log(msg);
        }
    </script>
</body>
</html>
